<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Assistant Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appleblue: '#007AFF',
            applegray: '#F5F5F7',
            appledark: '#1D1D1F',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .card { @apply bg-white rounded-2xl shadow-sm border border-gray-100; }
    .btn-primary { @apply bg-appleblue text-white px-5 py-2.5 rounded-xl font-medium hover:bg-blue-600 transition active:scale-95; }
    .btn-secondary { @apply bg-gray-100 text-appledark px-5 py-2.5 rounded-xl font-medium hover:bg-gray-200 transition; }
    .sidebar-item { @apply flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer transition; }
    .sidebar-item.active { @apply bg-appleblue text-white; }
    .sidebar-item:not(.active):hover { @apply bg-gray-100; }
    .input-field { @apply w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-appleblue focus:border-transparent; }
  </style>
</head>
<body class="bg-applegray text-appledark min-h-screen">
  <div id="app" class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col p-4 shrink-0">
      <div class="mb-8 px-2">
        <h1 class="text-xl font-semibold tracking-tight">Assistant</h1>
        <p class="text-sm text-gray-500 mt-0.5">Dashboard personale</p>
      </div>
      <nav class="flex-1 space-y-1">
        <div class="sidebar-item active" data-view="dashboard">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span>Dashboard</span>
        </div>
        <div class="sidebar-item" data-view="mail">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>Mail</span>
        </div>
        <div class="sidebar-item" data-view="calendar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>Calendario</span>
        </div>
        <div class="sidebar-item" data-view="finances">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>Finanze</span>
        </div>
        <div class="sidebar-item" data-view="research">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span>Ricerche & Riassunti</span>
        </div>
        <div class="sidebar-item" data-view="compose">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
          <span>Invia Messaggio</span>
        </div>
      </nav>
      <div class="mt-auto pt-4 border-t border-gray-100 text-xs text-gray-400 px-2">
        Dati salvati in locale · Demo mode
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto p-8">
      <div id="content"></div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-appledark text-white px-5 py-3 rounded-xl shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50"></div>

  <script>
    // ========== DATA LAYER (localStorage) ==========
    const STORAGE_KEY = 'personal-assistant-data';

    const defaultData = {
      emails: [
        { id: '1', from: 'marco@azienda.it', subject: 'Riunione progetto Q4', preview: 'Ciao, confermi la riunione di giovedì alle 15?', date: '2026-10-13T09:30:00', read: false, folder: 'inbox' },
        { id: '2', from: 'newsletter@tech.com', subject: 'Le novità di ottobre', preview: 'Ecco le 5 tendenze AI da conoscere questo mese...', date: '2026-10-12T14:15:00', read: true, folder: 'inbox' },
        { id: '3', from: 'me@local', subject: 'Promemoria vacanze', preview: 'Ricordati di prenotare i voli entro venerdì.', date: '2026-10-11T18:00:00', read: true, folder: 'sent' },
      ],
      events: [
        { id: '1', title: 'Standup team', date: '2026-10-14', time: '09:30', color: 'blue' },
        { id: '2', title: 'Call cliente Rossi', date: '2026-10-14', time: '15:00', color: 'green' },
        { id: '3', title: 'Dentista', date: '2026-10-16', time: '11:00', color: 'orange' },
        { id: '4', title: 'Deadline report', date: '2026-10-17', time: '18:00', color: 'red' },
      ],
      transactions: [
        { id: '1', description: 'Stipendio Ottobre', amount: 2450, type: 'income', date: '2026-10-01', category: 'Lavoro' },
        { id: '2', description: 'Affitto', amount: -850, type: 'expense', date: '2026-10-02', category: 'Casa' },
        { id: '3', description: 'Spesa settimanale', amount: -67.40, type: 'expense', date: '2026-10-05', category: 'Cibo' },
        { id: '4', description: 'Abbonamento Netflix', amount: -15.99, type: 'expense', date: '2026-10-08', category: 'Svago' },
        { id: '5', description: 'Freelance progetto', amount: 320, type: 'income', date: '2026-10-10', category: 'Lavoro' },
      ],
      notes: [
        { id: '1', title: 'Ricerca: AI Agents 2026', theme: 'Tecnologia', content: 'Gli agent autonomi stanno diventando mainstream. Principali player: OpenAI, Anthropic, xAI. Casi d\'uso: customer support, coding, research.', summary: 'Agent AI in forte crescita. Focus su autonomia e tool use.', date: '2026-10-10' },
        { id: '2', title: 'Riassunto mail cliente', theme: 'Lavoro', content: 'Il cliente vuole anticipare la consegna di 2 settimane. Budget approvato. Serve conferma del team di sviluppo.', summary: 'Cliente chiede anticipo consegna +2 settimane. Budget ok.', date: '2026-10-12' },
      ]
    };

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
        return structuredClone(defaultData);
      }
      return JSON.parse(raw);
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    let data = loadData();

    // ========== UTILS ==========
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 2800);
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function formatMoney(n) {
      return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(n);
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // ========== RENDERERS ==========
    function renderDashboard() {
      const unread = data.emails.filter(e => !e.read && e.folder === 'inbox').length;
      const today = new Date().toISOString().slice(0, 10);
      const todayEvents = data.events.filter(e => e.date === today || e.date === '2026-10-14'); // demo
      const balance = data.transactions.reduce((s, t) => s + t.amount, 0);
      const monthExpense = data.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + Math.abs(t.amount), 0);

      return `
        <div class="max-w-5xl">
          <h2 class="text-3xl font-semibold mb-1">Buonasera 👋</h2>
          <p class="text-gray-500 mb-8">Ecco il riepilogo della tua giornata</p>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
            <div class="card p-6">
              <div class="text-sm text-gray-500 mb-1">Mail non lette</div>
              <div class="text-3xl font-semibold text-appleblue">${unread}</div>
            </div>
            <div class="card p-6">
              <div class="text-sm text-gray-500 mb-1">Eventi oggi</div>
              <div class="text-3xl font-semibold">${todayEvents.length}</div>
            </div>
            <div class="card p-6">
              <div class="text-sm text-gray-500 mb-1">Saldo attuale</div>
              <div class="text-3xl font-semibold ${balance >= 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(balance)}</div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card p-6">
              <h3 class="font-semibold mb-4">Prossimi eventi</h3>
              <div class="space-y-3">
                ${data.events.slice(0, 4).map(e => `
                  <div class="flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-${e.color}-500"></div>
                    <div class="flex-1">
                      <div class="font-medium">${e.title}</div>
                      <div class="text-sm text-gray-500">${e.date} · ${e.time}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="card p-6">
              <h3 class="font-semibold mb-4">Ultime mail</h3>
              <div class="space-y-3">
                ${data.emails.filter(e => e.folder === 'inbox').slice(0, 3).map(e => `
                  <div class="flex items-start gap-3 ${e.read ? '' : 'font-medium'}">
                    <div class="w-2 h-2 mt-2 rounded-full ${e.read ? 'bg-transparent' : 'bg-appleblue'}"></div>
                    <div class="flex-1 min-w-0">
                      <div class="truncate">${e.subject}</div>
                      <div class="text-sm text-gray-500 truncate">${e.from}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMail() {
      const inbox = data.emails.filter(e => e.folder === 'inbox');
      return `
        <div class="max-w-4xl">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-semibold">Mail</h2>
            <button class="btn-primary" onclick="switchView('compose')">Nuova mail</button>
          </div>
          <div class="card overflow-hidden">
            ${inbox.length === 0 ? '<div class="p-8 text-center text-gray-500">Nessuna mail</div>' : inbox.map(e => `
              <div class="border-b border-gray-100 last:border-0 p-4 hover:bg-gray-50 cursor-pointer flex gap-4" onclick="openEmail('${e.id}')">
                <div class="w-2 h-2 mt-2 rounded-full shrink-0 ${e.read ? 'bg-transparent' : 'bg-appleblue'}"></div>
                <div class="flex-1 min-w-0">
                  <div class="flex justify-between gap-4">
                    <span class="${e.read ? '' : 'font-semibold'} truncate">${e.from}</span>
                    <span class="text-sm text-gray-400 shrink-0">${formatDate(e.date)}</span>
                  </div>
                  <div class="${e.read ? '' : 'font-medium'} truncate">${e.subject}</div>
                  <div class="text-sm text-gray-500 truncate">${e.preview}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCalendar() {
      return `
        <div class="max-w-3xl">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-semibold">Calendario</h2>
            <button class="btn-primary" onclick="showAddEvent()">Aggiungi evento</button>
          </div>
          <div class="card p-6 space-y-4" id="events-list">
            ${data.events.sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time)).map(e => `
              <div class="flex items-center gap-4 p-3 rounded-xl hover:bg-gray-50">
                <div class="w-12 text-center">
                  <div class="text-xs text-gray-500 uppercase">${new Date(e.date).toLocaleDateString('it-IT', {weekday:'short'})}</div>
                  <div class="text-xl font-semibold">${new Date(e.date).getDate()}</div>
                </div>
                <div class="w-1 h-10 rounded-full bg-${e.color}-500"></div>
                <div class="flex-1">
                  <div class="font-medium">${e.title}</div>
                  <div class="text-sm text-gray-500">${e.time}</div>
                </div>
                <button class="text-gray-400 hover:text-red-500 text-sm" onclick="deleteEvent('${e.id}')">Elimina</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderFinances() {
      const balance = data.transactions.reduce((s, t) => s + t.amount, 0);
      const income = data.transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const expense = data.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + Math.abs(t.amount), 0);

      return `
        <div class="max-w-4xl">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-semibold">Finanze</h2>
            <button class="btn-primary" onclick="showAddTransaction()">Aggiungi transazione</button>
          </div>

          <div class="grid grid-cols-3 gap-5 mb-8">
            <div class="card p-5">
              <div class="text-sm text-gray-500">Saldo</div>
              <div class="text-2xl font-semibold ${balance >= 0 ? 'text-green-600' : 'text-red-500'}">${formatMoney(balance)}</div>
            </div>
            <div class="card p-5">
              <div class="text-sm text-gray-500">Entrate</div>
              <div class="text-2xl font-semibold text-green-600">${formatMoney(income)}</div>
            </div>
            <div class="card p-5">
              <div class="text-sm text-gray-500">Uscite</div>
              <div class="text-2xl font-semibold text-red-500">${formatMoney(expense)}</div>
            </div>
          </div>

          <div class="card overflow-hidden">
            <div class="p-4 border-b border-gray-100 font-medium">Movimenti recenti</div>
            ${data.transactions.sort((a,b) => b.date.localeCompare(a.date)).map(t => `
              <div class="flex items-center justify-between p-4 border-b border-gray-50 last:border-0">
                <div>
                  <div class="font-medium">${t.description}</div>
                  <div class="text-sm text-gray-500">${t.date} · ${t.category}</div>
                </div>
                <div class="font-semibold ${t.amount >= 0 ? 'text-green-600' : 'text-red-500'}">
                  ${t.amount >= 0 ? '+' : ''}${formatMoney(t.amount)}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderResearch() {
      return `
        <div class="max-w-4xl">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-semibold">Ricerche & Riassunti</h2>
            <button class="btn-primary" onclick="showAddNote()">Nuova nota</button>
          </div>
          <div class="grid gap-5">
            ${data.notes.map(n => `
              <div class="card p-6">
                <div class="flex items-start justify-between gap-4 mb-3">
                  <div>
                    <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-appleblue mb-2">${n.theme}</span>
                    <h3 class="text-lg font-semibold">${n.title}</h3>
                  </div>
                  <button class="text-gray-400 hover:text-red-500 text-sm" onclick="deleteNote('${n.id}')">Elimina</button>
                </div>
                <p class="text-gray-600 mb-4 text-sm leading-relaxed">${n.content}</p>
                <div class="bg-applegray rounded-xl p-4">
                  <div class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Riassunto</div>
                  <div class="text-sm">${n.summary}</div>
                </div>
                <div class="text-xs text-gray-400 mt-3">${n.date}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCompose() {
      return `
        <div class="max-w-xl">
          <h2 class="text-2xl font-semibold mb-6">Invia messaggio</h2>
          <div class="card p-6 space-y-5">
            <div>
              <label class="block text-sm font-medium mb-1.5">Canale</label>
              <select id="compose-channel" class="input-field" onchange="toggleComposeFields()">
                <option value="email">Email</option>
                <option value="telegram">Telegram</option>
              </select>
            </div>
            <div id="email-fields">
              <div class="mb-4">
                <label class="block text-sm font-medium mb-1.5">A (email)</label>
                <input type="email" id="compose-to" class="input-field" placeholder="destinatario@esempio.com" />
              </div>
              <div class="mb-4">
                <label class="block text-sm font-medium mb-1.5">Oggetto</label>
                <input type="text" id="compose-subject" class="input-field" placeholder="Oggetto della mail" />
              </div>
            </div>
            <div id="telegram-fields" class="hidden">
              <div class="mb-4">
                <label class="block text-sm font-medium mb-1.5">Chat ID / Username Telegram</label>
                <input type="text" id="compose-chat" class="input-field" placeholder="@username oppure chat_id" />
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1.5">Messaggio</label>
              <textarea id="compose-body" class="input-field h-32 resize-none" placeholder="Scrivi il tuo messaggio..."></textarea>
            </div>
            <div class="flex gap-3 pt-2">
              <button class="btn-primary flex-1" onclick="sendMessage()">Invia</button>
              <button class="btn-secondary" onclick="switchView('dashboard')">Annulla</button>
            </div>
            <p class="text-xs text-gray-400 pt-2">
              Modalità demo: i messaggi vengono salvati localmente e mostrati come "inviati". 
              Per invii reali vedi README (Telegram Bot API / SMTP).
            </p>
          </div>
        </div>
      `;
    }

    // ========== ACTIONS ==========
    function switchView(view) {
      document.querySelectorAll('.sidebar-item').forEach(el => {
        el.classList.toggle('active', el.dataset.view === view);
      });
      const content = document.getElementById('content');
      const renderers = {
        dashboard: renderDashboard,
        mail: renderMail,
        calendar: renderCalendar,
        finances: renderFinances,
        research: renderResearch,
        compose: renderCompose
      };
      content.innerHTML = (renderers[view] || renderDashboard)();
    }

    function openEmail(id) {
      const email = data.emails.find(e => e.id === id);
      if (!email) return;
      email.read = true;
      saveData(data);
      showToast('Mail segnata come letta');
      switchView('mail');
    }

    function toggleComposeFields() {
      const channel = document.getElementById('compose-channel').value;
      document.getElementById('email-fields').classList.toggle('hidden', channel !== 'email');
      document.getElementById('telegram-fields').classList.toggle('hidden', channel !== 'telegram');
    }

    function sendMessage() {
      const channel = document.getElementById('compose-channel').value;
      const body = document.getElementById('compose-body').value.trim();
      if (!body) {
        showToast('Scrivi un messaggio');
        return;
      }

      if (channel === 'email') {
        const to = document.getElementById('compose-to').value.trim();
        const subject = document.getElementById('compose-subject').value.trim() || '(senza oggetto)';
        if (!to) {
          showToast('Inserisci un destinatario');
          return;
        }
        data.emails.unshift({
          id: uid(),
          from: 'me@local',
          subject,
          preview: body.slice(0, 80),
          date: new Date().toISOString(),
          read: true,
          folder: 'sent'
        });
        saveData(data);
        showToast('Email inviata (simulata) ✓');
      } else {
        const chat = document.getElementById('compose-chat').value.trim();
        if (!chat) {
          showToast('Inserisci Chat ID o username');
          return;
        }
        // Simulate Telegram send
        showToast(`Messaggio Telegram inviato a ${chat} (simulato) ✓`);
      }
      document.getElementById('compose-body').value = '';
      setTimeout(() => switchView('dashboard'), 1200);
    }

    function showAddEvent() {
      const title = prompt('Titolo evento:');
      if (!title) return;
      const date = prompt('Data (YYYY-MM-DD):', new Date().toISOString().slice(0,10));
      if (!date) return;
      const time = prompt('Ora (HH:MM):', '10:00');
      data.events.push({ id: uid(), title, date, time: time || '10:00', color: 'blue' });
      saveData(data);
      showToast('Evento aggiunto');
      switchView('calendar');
    }

    function deleteEvent(id) {
      if (!confirm('Eliminare questo evento?')) return;
      data.events = data.events.filter(e => e.id !== id);
      saveData(data);
      switchView('calendar');
    }

    function showAddTransaction() {
      const description = prompt('Descrizione:');
      if (!description) return;
      const amountStr = prompt('Importo (positivo = entrata, negativo = uscita):');
      const amount = parseFloat(amountStr);
      if (isNaN(amount)) {
        showToast('Importo non valido');
        return;
      }
      const category = prompt('Categoria:', amount >= 0 ? 'Lavoro' : 'Altro') || 'Altro';
      data.transactions.push({
        id: uid(),
        description,
        amount,
        type: amount >= 0 ? 'income' : 'expense',
        date: new Date().toISOString().slice(0,10),
        category
      });
      saveData(data);
      showToast('Transazione aggiunta');
      switchView('finances');
    }

    function showAddNote() {
      const title = prompt('Titolo della ricerca/nota:');
      if (!title) return;
      const theme = prompt('Tema (es. Tecnologia, Lavoro, Finanza):', 'Generale') || 'Generale';
      const content = prompt('Contenuto / testo da riassumere:');
      if (!content) return;
      // Simple local "summary" (first sentence or truncated)
      const summary = content.split(/[.!?]/)[0].slice(0, 120) + (content.length > 120 ? '...' : '');
      data.notes.unshift({
        id: uid(),
        title,
        theme,
        content,
        summary,
        date: new Date().toISOString().slice(0,10)
      });
      saveData(data);
      showToast('Nota e riassunto creati');
      switchView('research');
    }

    function deleteNote(id) {
      if (!confirm('Eliminare questa nota?')) return;
      data.notes = data.notes.filter(n => n.id !== id);
      saveData(data);
      switchView('research');
    }

    // Init
    document.querySelectorAll('.sidebar-item').forEach(el => {
      el.addEventListener('click', () => switchView(el.dataset.view));
    });
    switchView('dashboard');
  </script>
</body>
</html>
